<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 단어 카드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#232a87;--ink-soft:#e9eaf7;--bg:#f4f3f8;--card:#fff;--line:#dedcea;--text:#1d1f33;--sub:#6b6d85;--bad:#fbe3e3;--bad-t:#a33a3a;--ok:#dff3e4;--ok-t:#2c7a43;--on-ink:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#aab1ff;--ink-soft:#242757;--bg:#14152a;--card:#1d1f3a;--line:#33365e;--text:#ecedf8;--sub:#9a9cc0;--bad:#4a2630;--bad-t:#ffb4b4;--ok:#1f3d2b;--ok-t:#9fe0b4;--on-ink:#14152a;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#aab1ff;--ink-soft:#242757;--bg:#14152a;--card:#1d1f3a;--line:#33365e;--text:#ecedf8;--sub:#9a9cc0;--bad:#4a2630;--bad-t:#ffb4b4;--ok:#1f3d2b;--ok-t:#9fe0b4;--on-ink:#14152a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{max-width:430px;margin:0 auto;min-height:100dvh;padding:16px 16px 24px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1{font-size:19px;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--sub);font-size:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--ink-soft);border-radius:12px;padding:3px}
.seg button{padding:9px;border-radius:10px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center;line-height:1.25}
.tab b{display:block;font-size:13px}.tab span{font-size:12px;color:var(--sub)}
.tab.on{background:var(--ink);border-color:var(--ink)}.tab.on b,.tab.on span{color:var(--on-ink)}
.bar{height:8px;background:var(--ink-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 0;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cell b{font-size:17px;color:var(--ink)}.cell span{font-size:11px;color:var(--sub)}
.cell.done{background:var(--ink-soft);border-color:var(--ink)}.cell.done b::after{content:" ✓";font-size:13px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{padding:14px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink)}
.pill:disabled{opacity:.45}
.foot{margin-top:auto;text-align:center;font-size:12px;color:var(--sub)}
.foot button{color:var(--sub);text-decoration:underline;font-size:12px;margin-left:6px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--ink-soft);border:1px solid var(--line)}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.small{padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink)}
.flash{flex:1;min-height:320px;background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;width:100%}
.han{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:700;color:var(--text);line-height:1.15}
.py{color:var(--ink);font-size:24px;font-weight:600;display:flex;align-items:center;gap:8px}
.ko{font-size:19px;line-height:1.5;word-break:keep-all}
.pos{font-size:12px;color:var(--sub);background:var(--ink-soft);padding:3px 10px;border-radius:99px}
.hint{font-size:14px;color:var(--sub);margin-top:6px}
.spk{width:36px;height:36px;border-radius:50%;background:var(--ink-soft);color:var(--ink);font-size:16px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts button{padding:20px 8px;border-radius:16px;font-size:18px;font-weight:700}
.no{background:var(--bad);color:var(--bad-t)}.yes{background:var(--ok);color:var(--ok-t)}
.acts button:disabled{opacity:.4}
.done-box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.done-box h2{margin:0;font-size:24px;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:12px}
.main{padding:16px;border-radius:14px;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:16px}
.opts{display:grid;gap:8px}
.opt{padding:12px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;color:var(--sub);line-height:1.3;word-break:keep-all}
.opt.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:700}
.opt:disabled{opacity:.4}
.sec{font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:600}
.start{padding:20px;border-radius:22px;font-size:18px;width:100%}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{width:100%;padding:18px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:17px;text-align:center;line-height:1.4;display:flex;flex-direction:column;align-items:center;gap:2px;word-break:keep-all;color:var(--text)}
.choice .p2{font-size:14px;color:var(--ink);font-weight:600}
.choice.yes{background:var(--ok);color:var(--ok-t);border-color:var(--ok-t);font-weight:700}
.choice.no{background:var(--bad);color:var(--bad-t);border-color:var(--bad-t);font-weight:700}
.choice.yes .han,.choice.no .han,.choice.yes .p2,.choice.no .p2{color:inherit}
.choice.dim{opacity:.45}
.ans-row{display:flex;gap:8px}
.exin{flex:1;min-width:0;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:18px}
.exin:focus{outline:2px solid var(--ink);outline-offset:0}
.exin.ok{background:var(--ok);color:var(--ok-t);border-color:var(--ok-t)}
.exin.bad{background:var(--bad);color:var(--bad-t);border-color:var(--bad-t)}
.ans-row .main{padding:0 22px}
.fb{padding:14px;border-radius:14px;text-align:center;font-weight:700;font-size:18px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.wrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:14px;text-align:left}
.wrow .han{font-size:26px;min-width:60px;text-align:center}
.wrow .py{font-size:15px}.wrow .ko{font-size:14px}
.score{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 16px;text-align:center}
.score b{display:block;font-size:34px;color:var(--ink)}
.hist{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.hrow{display:flex;justify-content:space-between;padding:9px 0;font-size:13px;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow b{color:var(--ink)}
</style>

const WORDS = RAW.map(r => ({
  id: r[0], h: r[1], p: r[2], k: r[3], pos: r[4] === '-' ? '기타' : r[4],
  len: [...r[1]].length, lv: r[5] || 3
}));

/* 저장소 어댑터: Firebase 등으로 확장하려면 load/save만 교체하면 됨 */
const Store = {
  key: 'hsk3-flashcards-v1',
  load() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
  save(s) { try { localStorage.setItem(this.key, JSON.stringify(s)); } catch (e) {} }
};
const saved = Store.load();
const S = { done: saved.done || {}, wrong: saved.wrong || {}, exams: saved.exams || [], mode: saved.mode || 'new', day: saved.day || 0 };
const persist = () => Store.save({ done: S.done, wrong: S.wrong, exams: S.exams, mode: S.mode, day: S.day });

const POS_ORDER = ['명사', '동사', '형용사', '부사', '양사', '전치사', '접속사', '대명사', '조사', '수사', '접미사'];
function buildDays(list) {
  const g = {};
  list.forEach(w => { const p = w.pos.split('/')[0]; (g[p] = g[p] || []).push(w); });
  const etc = [];
  const keys = Object.keys(g).sort((a, b) => (POS_ORDER.indexOf(a) + 99) % 99 - (POS_ORDER.indexOf(b) + 99) % 99);
  const days = [];
  keys.forEach(p => { if (g[p].length < 10) etc.push(...g[p]); else days.push([p, g[p]]); });
  if (etc.length) days.push(['기타', etc]);
  const out = [];
  days.forEach(([p, ws]) => {
    for (let i = 0; i < ws.length; i += 100) {
      const n = out.length + 1;
      out.push({ no: n, label: 'DAY ' + String(n).padStart(2, '0'), pos: p + (ws.length > 100 ? ' ' + (i / 100 + 1) : ''), words: ws.slice(i, i + 100) });
    }
  });
  return out;
}
const DAYS = { new: buildDays(WORDS.filter(w => w.lv === 3)), review: buildDays(WORDS.filter(w => w.lv < 3)) };

const $ = document.getElementById('app');
let sess = null;
const setKey = (ws) => 's' + ws[0].id;

function speak(t) {
  try { const u = new SpeechSynthesisUtterance(t); u.lang = 'zh-CN'; u.rate = .85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const inMode = w => S.mode === 'new' ? w.lv === 3 : w.lv < 3;
const wrongList = () => WORDS.filter(w => inMode(w) && S.wrong[w.id] > 0);

function home() {
  sess = null; ex = null;
  const days = DAYS[S.mode];
  if (S.day >= days.length) S.day = 0;
  const day = days[S.day];
  let h = `<div class="top"><h1>HSK 단어 카드</h1><span class="muted">${WORDS.filter(inMode).length}단어</span></div>
  <div class="seg"><button data-a="mode" data-v="new" class="${S.mode === 'new' ? 'on' : ''}">3급 신규</button><button data-a="mode" data-v="review" class="${S.mode === 'review' ? 'on' : ''}">이전 급수 복습</button></div>`;
  if (!day) {
    h += `<div class="empty">1·2급 단어 데이터가 아직 없어요.<br>RAW 배열에 급수 값을 1 또는 2로 지정한 단어를 추가하면 여기에 DAY로 나타나요.</div>`;
  } else {
    h += `<div class="tabs">${days.map((d, i) => `<button class="tab ${i === S.day ? 'on' : ''}" data-a="day" data-v="${i}"><b>${d.label}</b><span>${d.pos}</span></button>`).join('')}</div>`;
    const sets = []; for (let i = 0; i < day.words.length; i += 5) sets.push(day.words.slice(i, i + 5));
    const nd = sets.filter(s => S.done[setKey(s)]).length;
    h += `<div><div class="top muted"><span>${day.label} ${day.pos} · ${day.words.length}단어</span><span>${nd}/${sets.length} 세트</span></div><div class="bar" style="margin-top:6px"><i style="width:${nd / sets.length * 100}%"></i></div></div>
    <div class="grid">${sets.map((s, i) => `<button class="cell ${S.done[setKey(s)] ? 'done' : ''}" data-a="set" data-v="${i}"><b>${i + 1}</b><span>${i * 5 + 1}–${i * 5 + s.length}번</span></button>`).join('')}</div>`;
  }
  const wl = wrongList().length;
  h += `<div class="row"><button class="pill" data-a="wrong" ${wl ? '' : 'disabled'}>자주 틀린 단어 (${wl})</button><button class="pill" data-a="rand">전체 랜덤 10개</button></div>
  <div class="row"><button class="pill" data-a="examSetup">📝 단어 시험</button><button class="pill" data-a="hist" ${S.exams.length ? '' : 'disabled'}>시험 기록 (${S.exams.length})</button></div>
  ${showHist && S.exams.length ? histHtml() : ''}
  <div class="foot">기기에 저장 중<button data-a="reset">기록 지우기</button></div>`;
  $.innerHTML = h;
}

function start(title, ws, key, extra) {
  sess = Object.assign({ title, queue: ws.slice(), total: ws.length, cleared: 0, key, flip: false, miss: 0, seen: {} }, extra || {});
  card();
}

function card() {
  const w = sess.queue[0];
  if (!w) return finish();
  const s = sess;
  const dots = Array.from({ length: s.total }, (_, i) => `<i class="${i < s.cleared ? 'on' : ''}"></i>`).join('');
  const face = s.flip
    ? `<div class="han" style="font-size:${w.len > 3 ? 44 : 56}px">${w.h}</div>
       <div class="py">${w.p}<button class="spk" data-a="spk" aria-label="발음 듣기">🔊</button></div>
       <div class="ko">${w.k}</div><span class="pos">${w.pos} · ${w.lv}급</span>`
    : `<div class="han" style="font-size:${w.len > 3 ? 64 : w.len > 2 ? 80 : 96}px">${w.h}</div><div class="hint">탭해서 정답 보기</div>`;
  $.innerHTML = `<div class="top"><div><b>${s.title}</b></div><button class="small" data-a="home">목록</button></div>
  <div class="dots">${dots}</div>
  <div class="flash" role="button" tabindex="0" data-a="flip">${face}</div>
  <div class="acts"><button class="no" data-a="no" ${s.flip ? '' : 'disabled'}>× 몰랐어</button><button class="yes" data-a="yes" ${s.flip ? '' : 'disabled'}>○ 알았어</button></div>`;
}

function answer(ok) {
  const w = sess.queue.shift();
  const first = !sess.seen[w.id];
  sess.seen[w.id] = true;
  if (ok) {
    sess.cleared++;
    if (sess.mode === 'wrong' && first && S.wrong[w.id]) { S.wrong[w.id]--; if (!S.wrong[w.id]) delete S.wrong[w.id]; }
  } else {
    S.wrong[w.id] = (S.wrong[w.id] || 0) + 1; sess.miss++;
    sess.queue.splice(Math.min(2, sess.queue.length), 0, w);
  }
  sess.flip = false;
  persist(); card();
}

function finish() {
  if (sess.key) S.done[sess.key] = true;
  persist();
  const next = sess.next;
  $.innerHTML = `<div class="done-box"><div style="font-size:52px">🎉</div><h2>${sess.mode ? '끝!' : '세트 완료!'}</h2>
  <div class="muted">${sess.total}단어 · 틀린 횟수 ${sess.miss}번</div>
  <div class="stack">${next ? `<button class="main" data-a="next">다음 세트</button>` : ''}${sess.mode ? `<button class="pill" data-a="again">다시 하기</button>` : ''}<button class="pill" data-a="home">목록으로</button></div></div>`;
}

function openSet(i) {
  const day = DAYS[S.mode][S.day];
  const ws = day.words.slice(i * 5, i * 5 + 5);
  const hasNext = i * 5 + 5 < day.words.length;
  start(`세트 ${i + 1} · ${i * 5 + 1}–${i * 5 + ws.length}번`, ws, setKey(ws), { next: hasNext ? i + 1 : null, idx: i });
}
function startWrong() { start('자주 틀린 단어', shuffle(wrongList()), null, { mode: 'wrong' }); }
function startRand() { start('전체 랜덤 10개', shuffle(WORDS.filter(inMode)).slice(0, 10), null, { mode: 'rand' }); }

/* ===== 단어 시험 ===== */
const BYID = {}; WORDS.forEach(w => BYID[w.id] = w);
const examCfg = { count: 20, scope: 'all', dir: 'mix', type: 'mc' };
let ex = null, showHist = false;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const fmtTime = s => s >= 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s}초`;

/* 병음: 성조 부호·숫자·공백 무시, ü = u = v */
const normPy = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/v/g, 'u').replace(/[^a-z]/g, '');
const normKo = s => String(s).replace(/\s+/g, '').replace(/[~…·]/g, '').toLowerCase();
function meaningOk(input, k) {
  const a = normKo(input); if (!a) return false;
  const set = new Set();
  const add = x => { set.add(normKo(x)); set.add(normKo(x.replace(/\([^)]*\)/g, ''))); };
  add(k);
  k.split(/[,;，；]/).forEach(seg => {
    seg = seg.trim(); add(seg);
    /* A·B 서술어 → "A 서술어" / "B 서술어" 로 펼쳐서 각각 정답 처리 */
    const ps = seg.split('·').map(x => x.trim());
    if (ps.length < 2) return;
    const m = ps[ps.length - 1].match(/^(\S+?)([을를이가은는에의로과와도])(\s.*)$/);
    const suf = m ? m[2] + m[3] : '';
    ps.forEach((p, i) => add(i < ps.length - 1 ? p + suf : p));
  });
  set.delete('');
  return set.has(a);
}
function pinyinOk(input, w) {
  const a = normPy(input);
  return (!!a && a === normPy(w.p)) || input.replace(/\s+/g, '') === w.h;
}

function examPool(cfg) {
  if (cfg.fixed) return cfg.fixed.map(id => BYID[id]).filter(Boolean);
  return WORDS.filter(w => cfg.scope === 'all' || S.wrong[w.id] > 0);
}
function examSetup() {
  sess = null; ex = null;
  const c = examCfg;
  const wl = WORDS.filter(w => S.wrong[w.id] > 0).length;
  if (c.scope === 'wrong' && !wl) c.scope = 'all';
  const pool = examPool(c).length;
  const n = c.count ? Math.min(c.count, pool) : pool;
  const grp = (title, key, opts, cols) => `<div><div class="sec">${title}</div><div class="opts" style="grid-template-columns:repeat(${cols},1fr)">${opts.map(([v, l, dis]) =>
    `<button class="opt ${c[key] === v ? 'on' : ''}" data-a="cfg" data-k="${key}" data-v="${v}" ${dis ? 'disabled' : ''}>${l}</button>`).join('')}</div></div>`;
  $.innerHTML = `<div class="top"><h1>단어 시험</h1><button class="small" data-a="home">목록</button></div>
  ${grp('문제 수', 'count', [[20, '20'], [50, '50'], [100, '100'], [0, '전체']], 4)}
  ${grp('출제 범위', 'scope', [['all', '전체'], ['wrong', `자주 틀린 단어만 (${wl})`, !wl]], 2)}
  ${grp('출제 방향', 'dir', [['h2k', '한자 → 뜻·병음'], ['k2h', '뜻 → 한자'], ['mix', '섞어서']], 3)}
  ${grp('방식', 'type', [['mc', '4지선다'], ['typing', '직접 입력(병음 또는 뜻)']], 2)}
  <div class="muted" style="text-align:center">${pool}단어 중 ${n}문제 출제</div>
  <button class="main start" data-a="examStart">시험 시작</button>`;
}

function startExam(cfg) {
  const pool = examPool(cfg);
  if (!pool.length) return;
  let qs = shuffle(pool);                       // Fisher–Yates, 중복 없음
  if (cfg.count) qs = qs.slice(0, cfg.count);
  ex = {
    cfg, i: 0, score: 0, wrong: [], t0: Date.now(), res: null, pick: null, typed: '', fin: false,
    qs: qs.map(w => ({ w, dir: cfg.dir === 'mix' ? (Math.random() < .5 ? 'h2k' : 'k2h') : cfg.dir }))
  };
  prepQ(); examQ();
}

/* 오답 3개: 같은 글자 수 우선, 보기 순서 셔플 */
function prepQ() {
  const q = ex.qs[ex.i];
  if (ex.cfg.type !== 'mc') return;
  const w = q.w, h2k = q.dir === 'h2k';
  const txt = x => h2k ? x.p + '|' + x.k : x.h;
  const cand = WORDS.filter(x => x.id !== w.id && (h2k ? (x.h !== w.h && x.k !== w.k) : x.k !== w.k));
  const same = shuffle(cand.filter(x => x.len === w.len)), rest = shuffle(cand.filter(x => x.len !== w.len));
  const seen = new Set([txt(w)]), picks = [];
  for (const x of same.concat(rest)) {
    const t = txt(x); if (seen.has(t)) continue;
    seen.add(t); picks.push(x); if (picks.length === 3) break;
  }
  q.opts = shuffle([w, ...picks]);
}

function examQ() {
  const q = ex.qs[ex.i], n = ex.qs.length, w = q.w, ans = ex.res !== null, mc = ex.cfg.type === 'mc', h2k = q.dir === 'h2k';
  const prompt = h2k
    ? `<div class="han" style="font-size:${w.len > 3 ? 56 : w.len > 2 ? 72 : 88}px">${w.h}</div><div class="hint">${mc ? '알맞은 병음·뜻을 고르세요' : '병음과 뜻을 함께 입력하세요 (예: xiangjiao / 바나나)'}</div>`
    : `<div class="ko" style="font-size:26px;font-weight:600">${w.k}</div><div class="hint">${mc ? '알맞은 한자를 고르세요' : '한자를 입력하세요'}</div>`;
  let body;
  if (mc) {
    body = `<div class="choices">${q.opts.map((o, j) => {
      let cls = 'choice';
      if (ans) cls += o.id === w.id ? ' yes' : (j === ex.pick ? ' no' : ' dim');
      const lab = h2k ? `<span class="p2">${o.p}</span><span class="ko">${o.k}</span>` : `<span class="han" style="font-size:30px">${o.h}</span>`;
      return `<button class="${cls}" data-a="pick" data-v="${j}" ${ans ? 'disabled' : ''}>${lab}</button>`;
    }).join('')}</div>`;
  } else {
    body = `<div class="ans-row"><input id="exIn" class="exin ${ans ? (ex.res ? 'ok' : 'bad') : ''}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
      placeholder="${h2k ? '병음 / 뜻 (예: huanjing / 환경)' : '한자 입력 (예: 环境)'}" value="${esc(ex.typed)}" ${ans ? 'disabled' : ''}>
      ${ans ? '' : '<button class="main" data-a="check">확인</button>'}</div>
      ${ans ? '' : '<button class="small" style="align-self:center" data-a="skip">모르겠어요</button>'}`;
  }
  const fb = ans ? `<div class="fb ${ex.res ? 'yes' : 'no'}">${ex.res ? '○ 정답!' : '× 오답'}</div>
    <div class="acard"><div class="han" style="font-size:${w.len > 3 ? 40 : 52}px">${w.h}</div>
    <div class="py">${w.p}<button class="spk" data-a="spk" aria-label="발음 듣기">🔊</button></div>
    <div class="ko">${w.k}</div><span class="pos">${w.pos} · ${w.lv}급</span></div>
    <button class="main" data-a="enext">${ex.i + 1 >= n ? '결과 보기' : '다음'}</button>` : '';
  $.innerHTML = `<div class="top"><button class="small" data-a="quit">그만두기</button><b>${ex.i + 1} / ${n}</b></div>
  <div class="bar"><i style="width:${(ex.i + (ans ? 1 : 0)) / n * 100}%"></i></div>
  <div class="flash" style="flex:none;min-height:190px">${prompt}</div>${body}${fb}`;
  if (!ans && !mc) { const el = document.getElementById('exIn'); if (el) el.focus(); }
  else if (ans) { const nb = $.querySelector('[data-a="enext"]'); if (nb) nb.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}

function examAnswer(ok, pick) {
  if (!ex || ex.res !== null) return;           // 되돌아가기·재답변 불가
  const q = ex.qs[ex.i];
  ex.res = ok; ex.pick = pick;
  if (ok) ex.score++; else ex.wrong.push(q.w);
  examQ();
}
function examCheck() {
  const el = document.getElementById('exIn'); if (!el || ex.res !== null) return;
  const v = el.value.trim(); if (!v) return;
  ex.typed = v;
  const q = ex.qs[ex.i];
  /* 전체 입력 또는 / , ; 로 나눈 조각 중 하나라도 맞으면 정답 (예: "xiangjiao / 바나나") */
  const segs = [v].concat(v.split(/[\/,;，；]/).map(x => x.trim()).filter(Boolean));
  const pyOnly = s => { const a = normPy(s); return !!a && a === normPy(q.w.p); };
  const koPart = v.replace(/[A-Za-z0-9\u00C0-\u024F\u0300-\u036F]+/g, ' ').trim();
  const ok = q.dir === 'h2k'
    ? segs.some(s => pyOnly(s)) && segs.concat(koPart ? [koPart] : []).some(s => meaningOk(s, q.w.k))
    : segs.some(s => s.replace(/\s+/g, '') === q.w.h);
  examAnswer(ok, null);
}
function examNext() {
  if (!ex || ex.res === null || ex.fin) return;
  ex.i++;
  if (ex.i >= ex.qs.length) return examResult();
  ex.res = null; ex.pick = null; ex.typed = '';
  prepQ(); examQ(); window.scrollTo(0, 0);
}

function examResult() {
  ex.fin = true;
  const n = ex.qs.length, pct = Math.round(ex.score / n * 100), sec = Math.max(1, Math.round((Date.now() - ex.t0) / 1000));
  ex.wrong.forEach(w => { S.wrong[w.id] = (S.wrong[w.id] || 0) + 1; });   // 틀린 단어만 +1
  S.exams.unshift({ t: Date.now(), s: ex.score, n });
  S.exams = S.exams.slice(0, 10);
  persist();
  const rows = ex.wrong.map(w => `<div class="wrow"><div class="han">${w.h}</div><div><div class="py">${w.p}</div><div class="ko">${w.k}</div></div></div>`).join('');
  $.innerHTML = `<div class="score"><div style="font-size:40px">${pct === 100 ? '🎉' : pct >= 70 ? '👏' : '💪'}</div>
    <b>${ex.score} / ${n} (${pct}%)</b><div class="muted" style="margin-top:6px">걸린 시간 ${fmtTime(sec)}</div></div>
  ${ex.wrong.length ? `<div class="sec" style="margin:2px 0 -6px">틀린 문제 ${ex.wrong.length}개</div>${rows}` : `<div class="empty">모두 맞혔어요! 🎯</div>`}
  <div class="stack" style="margin-top:4px">${ex.wrong.length ? `<button class="main" data-a="retryWrong">틀린 문제만 다시 시험</button>` : ''}
  <button class="pill" data-a="retryAll">다시 시험 (새로 섞기)</button><button class="pill" data-a="home">목록으로</button></div>`;
  window.scrollTo(0, 0);
}

function histHtml() {
  const p = n => String(n).padStart(2, '0');
  return `<div class="hist">${S.exams.map(e => { const d = new Date(e.t);
    return `<div class="hrow"><span>${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}</span><span>${e.n}문제</span><b>${e.s} / ${e.n} (${Math.round(e.s / e.n * 100)}%)</b></div>`; }).join('')}</div>`;
}

$.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const a = b.dataset.a, v = b.dataset.v, k = b.dataset.k;
  if (a === 'mode') { S.mode = v; S.day = 0; persist(); home(); }
  else if (a === 'day') { S.day = +v; persist(); home(); }
  else if (a === 'set') openSet(+v);
  else if (a === 'wrong') startWrong();
  else if (a === 'rand') startRand();
  else if (a === 'home') home();
  else if (a === 'flip') { sess.flip = !sess.flip; card(); }
  else if (a === 'spk') { e.stopPropagation(); const sw = ex ? ex.qs[ex.i].w : sess && sess.queue[0]; if (sw) speak(sw.h); }
  else if (a === 'yes') answer(true);
  else if (a === 'no') answer(false);
  else if (a === 'next') openSet(sess.next);
  else if (a === 'again') (sess.mode === 'wrong' ? startWrong : startRand)();
  else if (a === 'reset') { if (confirm('진도, 오답, 시험 기록을 모두 지울까?')) { S.done = {}; S.wrong = {}; S.exams = []; persist(); home(); } }
  else if (a === 'hist') { showHist = !showHist; home(); }
  else if (a === 'examSetup') examSetup();
  else if (a === 'cfg') { examCfg[k] = k === 'count' ? +v : v; examSetup(); }
  else if (a === 'examStart') startExam(Object.assign({}, examCfg));
  else if (a === 'pick') { const q = ex.qs[ex.i]; examAnswer(q.opts[+v].id === q.w.id, +v); }
  else if (a === 'check') examCheck();
  else if (a === 'skip') { ex.typed = ''; examAnswer(false, null); }
  else if (a === 'enext') examNext();
  else if (a === 'quit') { if (confirm('시험을 그만둘까요? 진행 내용은 저장되지 않아요.')) home(); }
  else if (a === 'retryWrong') startExam(Object.assign({}, ex.cfg, { fixed: ex.wrong.map(w => w.id), count: 0 }));
  else if (a === 'retryAll') startExam(Object.assign({}, ex.cfg));
});
$.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229 && e.target.id === 'exIn') { e.preventDefault(); examCheck(); }
});
home();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
</body>
